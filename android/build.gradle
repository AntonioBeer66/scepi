// Appli Android : le site de la bêta en plein écran dans une WebView.
//   gradlew assembleDebug  ->  build/outputs/apk/debug/app-debug.apk
plugins { id "com.android.application" version "8.7.3" }

android {
    namespace "fr.scepi.app"
    compileSdk 35
    defaultConfig {
        applicationId "fr.scepi.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
