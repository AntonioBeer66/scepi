# Serveur de coinche (server/index.js) sur Render, offre gratuite :
# Dashboard Render > New > Blueprint > ce dépôt. Le service s'endort après
# 15 min sans trafic et se réveille (environ 1 min) à la visite suivante ;
# les parties en cours sont alors perdues (elles vivent en mémoire).
# ORIGINS : l'adresse du site, par ex. https://antoniobeer66.github.io
services:
  - type: web
    name: scepi-coinche
    runtime: node
    plan: free
    branch: test
    buildCommand: npm ci --omit=dev
    startCommand: npm run server
    healthCheckPath: /tables
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ORIGINS
        sync: false
